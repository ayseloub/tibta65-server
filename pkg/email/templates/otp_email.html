<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background-color:#09182F;padding:24px;text-align:center;">
              <span style="color:#ffffff;font-size:20px;font-weight:bold;">TIBTA 65</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="color:#353535;margin:0 0 8px 0;">{{.Title}}</h2>
              <p style="color:#666666;font-size:14px;line-height:1.6;margin:0 0 24px 0;">{{.Message}}</p>
              <div style="background-color:#F3F3F3;border-radius:8px;padding:20px;text-align:center;margin-bottom:24px;">
                <span style="font-size:32px;font-weight:bold;letter-spacing:8px;color:#B3001B;">{{.Code}}</span>
              </div>
              <p style="color:#999999;font-size:12px;margin:0;">Kode ini berlaku selama 10 menit. Jangan bagikan kode ini kepada siapa pun, termasuk pihak yang mengaku dari TIBTA 65.</p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#f9f9f9;padding:16px;text-align:center;">
              <span style="color:#999999;font-size:11px;">© {{.Year}} TIBTA 65 — Tidar Bhakti Tiada Akhir</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
