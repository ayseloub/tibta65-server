basePath: /
definitions:
  auth.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  backgroundcontent.updateRequest:
    properties:
      description:
        type: string
      title:
        type: string
    type: object
  response.Envelope:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/response.Meta'
    type: object
  response.Meta:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: API backend untuk Tibta65 — auth admin, member, kegiatan, dll.
  title: Tibta65 API
  version: "1.0"
paths:
  /api/achievements:
    get:
      parameters:
      - description: Halaman
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      - description: Filter tahun
        in: query
        name: year
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: List achievement (publik)
      tags:
      - achievement
  /api/admin/achievements:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Tahun
        in: formData
        name: year
        required: true
        type: string
      - description: Judul
        in: formData
        name: title
        required: true
        type: string
      - description: Deskripsi
        in: formData
        name: description
        required: true
        type: string
      - description: Gambar
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Tambah achievement baru
      tags:
      - achievement
  /api/admin/achievements/{id}:
    delete:
      parameters:
      - description: ID achievement
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Hapus achievement
      tags:
      - achievement
    get:
      parameters:
      - description: ID achievement
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Detail achievement (admin, buat form edit)
      tags:
      - achievement
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: ID achievement
        in: path
        name: id
        required: true
        type: string
      - description: Tahun
        in: formData
        name: year
        required: true
        type: string
      - description: Judul
        in: formData
        name: title
        required: true
        type: string
      - description: Deskripsi
        in: formData
        name: description
        required: true
        type: string
      - description: Gambar baru (opsional)
        in: formData
        name: image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update achievement
      tags:
      - achievement
  /api/admin/background-content/{section}:
    put:
      consumes:
      - application/json
      description: Endpoint admin, butuh token
      parameters:
      - description: about atau sejarah
        in: path
        name: section
        required: true
        type: string
      - description: Judul dan deskripsi baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backgroundcontent.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update konten background (about/sejarah)
      tags:
      - background-content
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Login menggunakan username dan password, mengembalikan JWT token
      parameters:
      - description: Kredensial login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Login admin
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Ambil profil admin yang sedang login
      tags:
      - auth
  /api/background-content/{section}:
    get:
      description: Endpoint publik, dipakai landing page
      parameters:
      - description: about atau sejarah
        in: path
        name: section
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Ambil konten background (about/sejarah)
      tags:
      - background-content
securityDefinitions:
  BearerAuth:
    description: 'Ketik "Bearer" diikuti spasi dan JWT token. Contoh: "Bearer eyJhbGc..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
